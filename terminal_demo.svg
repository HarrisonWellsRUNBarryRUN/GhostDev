<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1140" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0a0c10" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <style>
    @keyframes lineFadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .term-window { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; font-size: 13px; line-height: 20px; }
    .title { fill: #8b949e; font-size: 12px; font-weight: 500; }
    .cmd { fill: #58a6ff; font-weight: bold; }
    .prompt-sym { fill: #7ee787; font-weight: bold; }
    .dim { fill: #484f58; }
    .banner { fill: #bc8cff; font-weight: bold; }
    .banner-sub { fill: #79c0ff; }
    .diag { fill: #38bdf8; font-weight: bold; }
    .coder { fill: #fbbf24; font-weight: bold; }
    .tester-fail { fill: #f85149; font-weight: bold; }
    .tester-pass { fill: #3fb950; font-weight: bold; }
    .git { fill: #d2a8ff; font-weight: bold; }
    .text-white { fill: #e6edf3; }
    .text-gray { fill: #8b949e; }
    .badge-fail { fill: #f85149; font-weight: bold; }
    .badge-pass { fill: #3fb950; font-weight: bold; }
    .pr-header { fill: #f0883e; font-weight: bold; }
    .cursor { fill: #58a6ff; animation: blink 1s infinite; }
    
    .anim-0 { animation: lineFadeIn 0.3s ease forwards; animation-delay: 0.1s; }
    .anim-1 { animation: lineFadeIn 0.3s ease forwards; animation-delay: 0.3s; }
    .anim-2 { animation: lineFadeIn 0.3s ease forwards; animation-delay: 0.6s; }
    .anim-3 { animation: lineFadeIn 0.3s ease forwards; animation-delay: 1.0s; }
    .anim-4 { animation: lineFadeIn 0.3s ease forwards; animation-delay: 1.4s; }
    .anim-5 { animation: lineFadeIn 0.3s ease forwards; animation-delay: 1.8s; }
    .anim-6 { animation: lineFadeIn 0.3s ease forwards; animation-delay: 2.2s; }
    .anim-7 { animation: lineFadeIn 0.3s ease forwards; animation-delay: 2.6s; }
    .anim-8 { animation: lineFadeIn 0.3s ease forwards; animation-delay: 3.0s; }
    .anim-9 { animation: lineFadeIn 0.3s ease forwards; animation-delay: 3.4s; }
    .anim-10 { animation: lineFadeIn 0.3s ease forwards; animation-delay: 3.8s; }
  </style>

  <!-- Window Container -->
  <rect x="20" y="20" width="880" height="1100" rx="16" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Window Titlebar -->
  <path d="M 20 36 A 16 16 0 0 1 36 20 L 884 20 A 16 16 0 0 1 900 36 L 900 64 L 20 64 Z" fill="#161b22" />
  <line x1="20" y1="64" x2="900" y2="64" stroke="#30363d" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="48" cy="42" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
  <circle cx="68" cy="42" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
  <circle cx="88" cy="42" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

  <!-- Title Text -->
  <text x="460" y="46" text-anchor="middle" class="title">👻 GhostDev Multi-Agent Console — Self-Healing Engine (LangGraph)</text>

  <!-- Terminal Content Body -->
  <g class="term-window" transform="translate(48, 96)">
    
    <!-- Command Entry -->
    <g class="anim-0">
      <text y="0"><tspan class="prompt-sym">ghostdev@ai-core</tspan> <tspan class="dim">in</tspan> <tspan class="text-white">~/GhostDev</tspan> <tspan class="dim">(master)</tspan></text>
      <text y="24"><tspan class="prompt-sym">$</tspan> <tspan class="cmd">python main.py</tspan></text>
    </g>

    <!-- Header Banner -->
    <g class="anim-1">
      <text y="58" class="dim">======================================================================</text>
      <text y="78" class="banner">👻 GHOSTDEV: AUTONOMOUS MULTI-AGENT SELF-HEALING ENGINE</text>
      <text y="98" class="banner-sub">   [Mode: Local Simulation &amp; Self-Correction Demonstration]</text>
      <text y="118" class="dim">======================================================================</text>
    </g>

    <!-- Diagnoser Node -->
    <g class="anim-2">
      <text y="148" class="diag">🔍 [1/4] Diagnoser-Agent: Analyzing issue and codebase...</text>
      <text y="170" class="text-gray">   📥 Ingested issue report: 'ZeroDivisionError in divide_numbers(a, b)'</text>
      <text y="190" class="text-gray">   📂 Scanned target file: <tspan class="text-white">sample_app.py</tspan></text>
      <text y="210" class="text-gray">   🎯 Target: <tspan class="text-white">sample_app.py</tspan></text>
      <text y="230" class="text-gray">   💡 Root Cause: <tspan class="text-white">divide_numbers() performs raw division without validating 'b == 0'</tspan></text>
      <text y="250" class="text-gray">   📋 Fix Plan: <tspan class="text-white">Add validation guard: if b == 0, return None instead of raising exception</tspan></text>
    </g>

    <!-- Coder Node Attempt 1 -->
    <g class="anim-3">
      <text y="284" class="coder">💻 [2/4] Coder-Agent: Implementing initial patch (Attempt 1)...</text>
      <text y="306" class="text-gray">   ⚠️  [Simulation Note]: Writing candidate fix (mistakenly returning 0 instead of None)...</text>
      <text y="326" class="text-gray">   💾 Saved candidate code to <tspan class="text-white">sample_app.py</tspan></text>
    </g>

    <!-- Tester Node Attempt 1 (Failure & Feedback) -->
    <g class="anim-4">
      <text y="360" class="tester-fail">🧪 [3/4] Tester-Agent: Executing unit test suite (Attempt 1)...</text>
      <text y="382"><tspan class="badge-fail">   ❌ Tests FAILED:</tspan> <tspan class="text-gray">AssertionError in test_sample_app.py: expected None when b == 0, but received 0</tspan></text>
      <text y="402" class="badge-fail">   📢 Triggering self-correction loop to Coder-Agent (Attempt 1/3)...</text>
    </g>

    <!-- Coder Node Attempt 2 (Self-Correction) -->
    <g class="anim-5">
      <text y="436" class="coder">💻 [2/4] Coder-Agent: Self-correcting code based on Tester feedback (Attempt 2)...</text>
      <text y="458" class="text-gray">   📥 Analyzing Tester-Agent feedback:</text>
      <text y="478" class="text-gray">      -&gt; Expected: <tspan class="tester-pass">None</tspan> | Received: <tspan class="tester-fail">0</tspan> (AssertionError: assert 0 is None)</text>
      <text y="498" class="text-gray">   🛠️ Refining patch: Correcting return value to <tspan class="tester-pass">'None'</tspan> when b == 0...</text>
      <text y="518" class="text-gray">   💾 Saved candidate code to <tspan class="text-white">sample_app.py</tspan></text>
    </g>

    <!-- Tester Node Attempt 2 (Success) -->
    <g class="anim-6">
      <text y="552" class="tester-pass">🧪 [3/4] Tester-Agent: Executing unit test suite (Attempt 2)...</text>
      <text y="574"><tspan class="badge-pass">   ✅ Tests PASSED:</tspan> <tspan class="text-white">All 4 unit tests in test_sample_app.py passed successfully.</tspan></text>
      <text y="594" class="text-gray">   🎯 Ready for git release.</text>
    </g>

    <!-- Git Node -->
    <g class="anim-7">
      <text y="628" class="git">📦 [4/4] Git-Agent: Managing version control and PR generation...</text>
      <text y="650" class="text-gray">   🌿 Active branch: <tspan class="banner-sub">fix/ghostdev-demo</tspan></text>
      <text y="670" class="text-gray">   📝 Committed changes: <tspan class="text-white">'fix(sample_app): handle zero division gracefully'</tspan></text>
    </g>

    <!-- PR Markdown Summary Block -->
    <g class="anim-8">
      <text y="704" class="dim">======================================================================</text>
      <text y="726" class="pr-header">## 👻 GhostDev Auto-Fix Summary</text>
      <text y="750" class="text-gray">- <tspan class="text-white">Branch:</tspan> <tspan class="banner-sub">fix/ghostdev-demo</tspan></text>
      <text y="770" class="text-gray">- <tspan class="text-white">Target File:</tspan> <tspan class="text-white">`sample_app.py`</tspan></text>
      <text y="790" class="text-gray">- <tspan class="text-white">Root Cause:</tspan> Function divide_numbers() performs raw division without validating 'b == 0'</text>
      <text y="810" class="text-gray">- <tspan class="text-white">Applied Patch:</tspan> Add validation guard at start: if b == 0, return None</text>
      <text y="830" class="text-gray">- <tspan class="text-white">Verification:</tspan> <tspan class="tester-pass">All 4 unit tests passed</tspan> (Self-correction cycles: 1)</text>
      <text y="852" class="dim">======================================================================</text>
    </g>

    <!-- Workflow Completion -->
    <g class="anim-9">
      <text y="884" class="banner-sub">🎉 GhostDev workflow execution completed.</text>
      <text y="906" class="tester-pass">✨ Successfully healed bug and pushed branch 'fix/ghostdev-demo'!</text>
    </g>

    <!-- Next Prompt Cursor -->
    <g class="anim-10">
      <text y="942"><tspan class="prompt-sym">ghostdev@ai-core</tspan> <tspan class="dim">in</tspan> <tspan class="text-white">~/GhostDev</tspan> <tspan class="dim">(fix/ghostdev-demo)</tspan></text>
      <text y="964"><tspan class="prompt-sym">$</tspan> <tspan class="cursor">█</tspan></text>
    </g>

  </g>
</svg>
